[project]
name = "opencode-ansible"
version = "0.1.0"
description = "Ansible role to install and upgrade opencode — offline, no Node.js"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "ansible>=8.0.0",
    "molecule>=6.0.0",
    "molecule-plugins[docker]>=23.0.0",
    "ansible-lint>=6.22.0",
    "pytest>=7.4.0",
    "pytest-testinfra>=10.1.0",
]

[tool.uv]
default-groups = ["dev"]
package = false
