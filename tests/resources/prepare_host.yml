---
- name: Prepare host — install python3 and create test user
  hosts: all
  become: false  # container runs as root; sudo is not installed yet
  gather_facts: false
  tasks:
    - name: Install python3 and sudo
      ansible.builtin.raw: apt-get update -qq && apt-get install -y -qq python3 sudo

    - name: Create non-root test user
      ansible.builtin.user:
        name: test
        shell: /bin/bash
        create_home: true
        state: present
