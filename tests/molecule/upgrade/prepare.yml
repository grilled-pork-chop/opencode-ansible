---
- import_playbook: ../../resources/prepare_host.yml

- import_playbook: ../../resources/prepare_bundle.yml
  vars:
    _bundle_version: "1.3.5"

- name: Prepare — install old version (1.3.5)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: opencode
      vars:
        opencode_version: "1.3.5"
        opencode_bundle_path: "/tmp/opencode-bundle-1.3.5.tar.gz"
        opencode_verify_checksum: false
        opencode_user: "test"
        opencode_provider_url: "http://old-server/v1"
        opencode_models:
          - name: "old-model"
        opencode_default_model: "old-model"

- import_playbook: ../../resources/prepare_bundle.yml
  vars:
    _bundle_version: "1.4.3"
