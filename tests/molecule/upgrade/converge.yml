---
- name: Converge — upgrade to 1.4.3
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: opencode
      vars:
        opencode_version: "1.4.3"
        opencode_bundle_path: "/tmp/opencode-bundle-1.4.3.tar.gz"
        opencode_verify_checksum: false
        opencode_user: "test"
        opencode_keep_backup: true
        opencode_provider_url: "http://old-server/v1"
        opencode_models:
          - name: "old-model"
          - name: "new-model"
        opencode_default_model: "old-model"
