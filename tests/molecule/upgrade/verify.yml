---
- name: Verify — upgrade
  hosts: all
  become: true
  gather_facts: false

  vars:
    _config: "/home/test/.config/opencode/opencode.json"
    opencode_version: "1.4.3"
    _old_version: "1.3.5"

  tasks:
    - name: "[test] Wrapper reports {{ opencode_version }}"
      ansible.builtin.command: /usr/local/bin/opencode --version
      register: _ver
      changed_when: false
      failed_when: opencode_version not in _ver.stdout

    - name: "[test] Old version not active"
      ansible.builtin.assert:
        that: _old_version not in _ver.stdout

    - name: "[test] Backup binary exists"
      ansible.builtin.stat:
        path: /opt/opencode/bin/opencode.bak.{{ _old_version }}
      register: _bak
      failed_when: not _bak.stat.exists

    - name: "[test] Backup reports {{ _old_version }}"
      ansible.builtin.command: /opt/opencode/bin/opencode.bak.{{ _old_version }} --version
      register: _bak_ver
      changed_when: false
      failed_when: _old_version not in _bak_ver.stdout

    - name: "[test] User 'test' runs upgraded opencode"
      ansible.builtin.command: /usr/local/bin/opencode --version
      become: true
      become_user: test
      register: _user_ver
      changed_when: false
      failed_when: opencode_version not in _user_ver.stdout

    - name: "[test] Config at standard path after upgrade"
      ansible.builtin.stat:
        path: "{{ _config }}"
      register: _cfg_stat
      failed_when: not _cfg_stat.stat.exists

    - name: "[test] Read config"
      ansible.builtin.slurp:
        src: "{{ _config }}"
      register: _cfg_raw

    - name: "[test] Parse config"
      ansible.builtin.set_fact:
        _cfg: "{{ _cfg_raw.content | b64decode | from_json }}"

    - name: "[test] Both models present after upgrade"
      ansible.builtin.assert:
        that:
          - "'old-model' in _cfg.provider.local.models"
          - "'new-model' in _cfg.provider.local.models"
        msg: "Models: {{ _cfg.provider.local.models.keys() | list }}"
