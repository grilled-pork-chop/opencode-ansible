---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  vars:
    opencode_version: "1.17.11"
    _old_version: "1.0.0"

  tasks:
    - name: Binary now reports the new pinned version
      ansible.builtin.command: /usr/local/bin/opencode --version
      register: _ver
      changed_when: false
      failed_when: opencode_version not in _ver.stdout

    - name: The old binary was backed up (not deleted)
      ansible.builtin.stat:
        path: "/usr/local/bin/opencode.bak.{{ _old_version }}"
      register: _bak
      failed_when: not _bak.stat.exists

    - name: The backup still reports the old version
      ansible.builtin.command: "/usr/local/bin/opencode.bak.{{ _old_version }} --version"
      register: _bak_ver
      changed_when: false
      failed_when: _old_version not in _bak_ver.stdout
