---
- name: Prepare — python3, sudo, and test users
  hosts: all
  become: false  # container runs as root; sudo not installed yet
  gather_facts: false
  tasks:
    - name: Install python3 and sudo
      ansible.builtin.raw: apt-get update -qq && apt-get install -y -qq python3 sudo
      changed_when: false

    - name: Create test users
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /bin/bash
        create_home: true
      loop:
        - alice
        - bob
