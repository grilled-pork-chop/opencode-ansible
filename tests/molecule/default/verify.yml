---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  vars:
    opencode_version: "1.17.11"
    opencode_provider_url: "http://10.0.0.1:8000/v1"
    _config: "/home/alice/.config/opencode/opencode.jsonc"
    _expected:
      - opencode.jsonc
      - commands/commit.md
      - skills
      - plugins/opencode-local.ts
      - plugins/opencode-local-model

  tasks:
    - name: Binary installed and executable
      ansible.builtin.stat:
        path: /usr/local/bin/opencode
      register: _bin
      failed_when: not _bin.stat.exists or not _bin.stat.executable

    - name: Binary reports the pinned version
      ansible.builtin.command: /usr/local/bin/opencode --version
      register: _ver
      changed_when: false
      failed_when: opencode_version not in _ver.stdout

    - name: Config + payload present for each user
      ansible.builtin.stat:
        path: "/home/{{ item.0 }}/.config/opencode/{{ item.1 }}"
      register: _paths
      failed_when: not _paths.stat.exists
      loop: "{{ ['alice', 'bob'] | product(_expected) | list }}"

    - name: Plugin runtime staged in ~/.opencode for each user
      ansible.builtin.stat:
        path: "/home/{{ item }}/.opencode/node_modules/@opencode-ai/plugin/package.json"
      register: _deps
      failed_when: not _deps.stat.exists
      loop: [alice, bob]

    - name: Config is owned by the user
      ansible.builtin.stat:
        path: "{{ _config }}"
      register: _cfg_stat
      failed_when: _cfg_stat.stat.pw_name != 'alice'

    - name: Config carries the rendered provider URL and model
      ansible.builtin.slurp:
        src: "{{ _config }}"
      register: _cfg_raw

    - name: Assert provider URL substituted
      ansible.builtin.assert:
        that:
          - opencode_provider_url in (_cfg_raw.content | b64decode)
          - "'__PROVIDER_URL__' not in (_cfg_raw.content | b64decode)"
        msg: "opencode.jsonc was not templated correctly"
