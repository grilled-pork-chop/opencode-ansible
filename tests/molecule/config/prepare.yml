---
- import_playbook: ../../resources/prepare_host.yml
- import_playbook: ../../resources/prepare_bundle.yml
  vars:
    _bundle_version: "1.4.3"

- name: Prepare — initial install with original config
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: opencode
      vars:
        opencode_version: "1.4.3"
        opencode_bundle_path: "/tmp/opencode-bundle-1.4.3.tar.gz"
        opencode_verify_checksum: false
        opencode_user: "test"
        opencode_provider_url: "http://original-server/v1"
        opencode_models:
          - name: "original-model"
        opencode_default_model: "original-model"
