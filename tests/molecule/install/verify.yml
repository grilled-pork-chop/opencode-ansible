---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  vars:
    opencode_version: "1.17.11"
    opencode_provider_url: "http://10.0.0.1:8000/v1"
    opencode_marketplace_url: "http://10.0.0.2:9000"
    _config: "/home/alice/.config/opencode/opencode.jsonc"
    _expected:
      - opencode.jsonc
      - marketplace.json
      - commands/commit.md
      - plugins/opencode-local.ts
      - plugins/opencode-local-model
      - plugins/opencode-marketplace.ts
      - plugins/opencode-marketplace
      - instructions/AGENTS.md
      - skills/ai-marketplace/SKILL.md

  tasks:
    - name: Binary installed and executable
      ansible.builtin.stat:
        path: /usr/local/bin/opencode
      register: _bin
      failed_when: not _bin.stat.exists or not _bin.stat.executable

    - name: Binary reports the pinned version
      ansible.builtin.command: /usr/local/bin/opencode --version
      register: _ver
      changed_when: false
      failed_when: opencode_version not in _ver.stdout

    - name: Config + payload present for the primary user (alice)
      ansible.builtin.stat:
        path: "/home/alice/.config/opencode/{{ item }}"
      register: _paths
      failed_when: not _paths.stat.exists
      loop: "{{ _expected }}"

    - name: Plugin runtime staged in alice's ~/.opencode
      ansible.builtin.stat:
        path: /home/alice/.opencode/node_modules/@opencode-ai/plugin/package.json
      register: _deps
      failed_when: not _deps.stat.exists

    - name: Plugin runtime staged in alice's ~/.config/opencode
      ansible.builtin.stat:
        path: /home/alice/.config/opencode/node_modules/@opencode-ai/plugin/package.json
      register: _config_deps
      failed_when: not _config_deps.stat.exists

    - name: Bob (not the configured user) got NO opencode payload
      ansible.builtin.stat:
        path: "/home/bob/{{ item }}"
      register: _bob_paths
      failed_when: _bob_paths.stat.exists
      loop:
        - .config/opencode/opencode.jsonc
        - .opencode

    - name: Config is owned by the user
      ansible.builtin.stat:
        path: "{{ _config }}"
      register: _cfg_stat
      failed_when: _cfg_stat.stat.pw_name != 'alice'

    - name: Config carries the rendered provider URL and model
      ansible.builtin.slurp:
        src: "{{ _config }}"
      register: _cfg_raw

    - name: Assert provider URL substituted
      ansible.builtin.assert:
        that:
          - opencode_provider_url in (_cfg_raw.content | b64decode)
          - "'__PROVIDER_URL__' not in (_cfg_raw.content | b64decode)"
        msg: "opencode.jsonc was not templated correctly"

    - name: Assert instructions key references the deployed AGENTS.md
      ansible.builtin.assert:
        that:
          - "'\"instructions\"' in (_cfg_raw.content | b64decode)"
          - "'./instructions/AGENTS.md' in (_cfg_raw.content | b64decode)"
        msg: "opencode.jsonc is missing the instructions key"

    - name: Assert opencode.jsonc has NO npm "plugin" array (airgap regression guard)
      ansible.builtin.assert:
        that:
          - "'\"plugin\"' not in (_cfg_raw.content | b64decode)"
        msg: >-
          opencode.jsonc must not carry a "plugin" array — a bare name there makes
          OpenCode fetch the plugin from npm at startup, which breaks airgapped hosts.

    - name: Read the rendered marketplace.json plugin config
      ansible.builtin.slurp:
        src: "/home/alice/.config/opencode/marketplace.json"
      register: _mp_raw

    - name: Assert marketplace.json carries the endpoint
      ansible.builtin.assert:
        that:
          - opencode_marketplace_url in (_mp_raw.content | b64decode)
        msg: "marketplace.json was not templated with the marketplace endpoint"

    - name: The !marketplace wrapper is installed next to the binary and executable
      ansible.builtin.stat:
        path: /usr/local/bin/marketplace
      register: _mp_wrapper
      failed_when: not (_mp_wrapper.stat.exists and _mp_wrapper.stat.executable)

    # --- Reconciliation of alice's pre-existing user install (seeded in prepare) ---

    - name: Alice's ~/.opencode/bin/opencode is now a symlink to the fleet binary
      ansible.builtin.stat:
        path: /home/alice/.opencode/bin/opencode
      register: _alice_bin
      failed_when:
        - not (_alice_bin.stat.exists and _alice_bin.stat.islnk
               and _alice_bin.stat.lnk_target == '/usr/local/bin/opencode')

    - name: Alice's original binary was backed up (not deleted)
      ansible.builtin.find:
        paths: /home/alice/.opencode/bin
        patterns: "opencode.*.bak"
      register: _alice_bin_bak
      failed_when: _alice_bin_bak.matched < 1

    - name: Alice's opencode.jsonc is now the managed one
      ansible.builtin.assert:
        that: "'MANAGED BY ANSIBLE' in (_cfg_raw.content | b64decode)"
        msg: "alice's opencode.jsonc was not replaced by the managed template"

    - name: Alice's hand-authored opencode.jsonc was backed up
      ansible.builtin.find:
        paths: /home/alice/.config/opencode
        patterns: "opencode.jsonc.*.bak"
      register: _alice_jsonc_bak
      failed_when: _alice_jsonc_bak.matched < 1

    - name: Alice's stray opencode.json was moved aside, not deleted
      ansible.builtin.stat:
        path: /home/alice/.config/opencode/opencode.json
      register: _alice_json
      failed_when: _alice_json.stat.exists

    - name: Alice's opencode.json backup exists
      ansible.builtin.find:
        paths: /home/alice/.config/opencode
        patterns: "opencode.json.*.bak"
      register: _alice_json_bak
      failed_when: _alice_json_bak.matched < 1
