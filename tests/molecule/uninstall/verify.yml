---
- name: Verify — uninstall
  hosts: all
  become: true
  gather_facts: false

  vars:
    _config: "/home/test/.config/opencode/opencode.json"

  tasks:
    - name: "[test] Binary removed"
      ansible.builtin.stat:
        path: /opt/opencode/bin/opencode
      register: _bin
      failed_when: _bin.stat.exists

    - name: "[test] Install directory removed"
      ansible.builtin.stat:
        path: /opt/opencode
      register: _dir
      failed_when: _dir.stat.exists

    - name: "[test] Wrapper removed"
      ansible.builtin.stat:
        path: /usr/local/bin/opencode
      register: _wrap
      failed_when: _wrap.stat.exists

    - name: "[test] User config preserved"
      ansible.builtin.stat:
        path: "{{ _config }}"
      register: _cfg
      failed_when: not _cfg.stat.exists
