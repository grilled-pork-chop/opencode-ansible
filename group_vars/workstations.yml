---
# Settings for every host in the 'workstations' group.
# Override role defaults here; host_vars/<host>.yml can refine per host.

# The local OpenAI-compatible endpoint the deployed config points at.
# (Models are auto-discovered by the bundled local-model plugin.)
opencode_provider_url: "http://localhost:8000/v1"

# Accounts that receive the per-user opencode payload (config + commands +
# skills + plugins) in their ~/.config/opencode/. List the real users here.
opencode_users:
  - alice
  - bob
