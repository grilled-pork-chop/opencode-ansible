---
# Fleet-wide overrides for every host in the 'workstations' group.
# These override role defaults; host_vars/<host>.yml refines per host.
#
# The per-host primary user is NOT set here — put `opencode_user: <name>` in
# host_vars/<host>.yml. Fleet-wide settings (like the endpoints) live here.
#
# Uncomment and point at your fleet's endpoints:

# opencode_provider_url: "http://localhost:8000/v1"
# opencode_marketplace_url: "http://localhost:8000"
# opencode_keep_backup: true
# opencode_force_reinstall: false
