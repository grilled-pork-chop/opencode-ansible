---
- name: Uninstall opencode
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Remove the system binary
      ansible.builtin.file:
        path: "{{ opencode_bin_path }}"
        state: absent

    - name: Read passwd database to resolve user homes
      ansible.builtin.getent:
        database: passwd
      when: opencode_users | length > 0

    - name: Remove per-user opencode config
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd[item][4] }}/.config/opencode"
        state: absent
      loop: "{{ opencode_users }}"
      when: item in ansible_facts.getent_passwd

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Removed: {{ opencode_bin_path }}"
          - "Removed: ~/.config/opencode for {{ opencode_users | join(', ') | default('(none)', true) }}"
