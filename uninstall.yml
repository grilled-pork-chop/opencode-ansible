---
# Remove the system binary and the primary user's payload.
# opencode_bin_path falls back to its default here because this playbook does not
# apply the role (so role defaults are not in scope); opencode_user comes from the
# inventory / host_vars as usual.
- name: Uninstall opencode
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Remove the system binary
      ansible.builtin.file:
        path: "{{ opencode_bin_path | default('/usr/local/bin/opencode') }}"
        state: absent

    - name: Read passwd database to resolve the user's home
      ansible.builtin.getent:
        database: passwd
      when: opencode_user != ""

    - name: Remove the primary user's opencode config and plugin runtime
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd[opencode_user][4] }}/{{ item }}"
        state: absent
      loop:
        - .config/opencode
        - .opencode
      when:
        - opencode_user != ""
        - opencode_user in ansible_facts.getent_passwd

    - name: Summary
      ansible.builtin.debug:
        msg: "Removed opencode for {{ opencode_user | default('(none)', true) }}"
