---
# Add your workstations here.
# Set opencode_user to the primary user on each machine.
#
# Example:
#   alice-laptop:
#     ansible_host: 192.168.1.10
#     ansible_user: alice
#     opencode_user: alice

all:
  vars:
    ansible_user: your_ssh_user

  children:
    workstations:
      hosts: {}
