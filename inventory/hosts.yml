---
# Runs locally out of the box: ansible_connection: local deploys to THIS machine
# for the current user (needs passwordless sudo). Just `make deploy`.
#
# To deploy to a remote fleet instead, drop the local vars and list your hosts,
# with an admin login that has sudo on the targets, e.g.:
#   all:
#     vars:
#       ansible_user: ops
#     children:
#       workstations:
#         hosts:
#           alice-laptop:
#             ansible_host: 192.168.1.10
#             opencode_user: alice      # or in host_vars/alice-laptop.yml
all:
  vars:
    ansible_connection: local
    ansible_user: "{{ lookup('env', 'USER') }}"
    opencode_user: "{{ lookup('env', 'USER') }}"

  children:
    workstations:
      hosts:
        localhost:
