---
# Add your workstations here. Set the SSH user Ansible connects as
# (ansible_user); opencode_users (in group_vars/workstations.yml) controls
# which accounts on each host get opencode configured.
#
# Example:
#   workstations:
#     hosts:
#       alice-laptop:
#         ansible_host: 192.168.1.10
#         ansible_user: alice

all:
  vars:
    ansible_user: your_ssh_user

  children:
    workstations:
      hosts: {}
