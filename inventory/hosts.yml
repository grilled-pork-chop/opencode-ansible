---
# One block per machine. Everything a host needs is on the host, nothing is
# inherited from a group and nothing is looked up from the environment: read an
# entry and you know exactly what gets deployed where and for whom.
#
#   ansible_host   - address to reach it (omit when it matches the name)
#   ansible_user   - account Ansible logs in as, needs passwordless sudo
#   opencode_user  - account that gets ~/.config/opencode, REQUIRED on every host
#                    usually the same person as ansible_user, differs only when
#                    an admin account deploys on someone else's behalf
#
# Shared settings (provider + marketplace endpoints) stay in
# group_vars/workstations.yml, since those are the same fleet-wide.

all:
  children:
    workstations:
      hosts:
        # This machine. ansible_connection is required: a localhost that appears
        # in the inventory is treated like any other host and gets SSHed to.
        # No ansible_user, a local connection runs as whoever invoked
        # ansible-playbook, so setting one would do nothing.
        localhost:
          ansible_connection: local
          opencode_user: your-username

        # Remote workstations. Uncomment and edit for a real fleet.
        # alice-laptop:
        #   ansible_host: 192.168.1.10
        #   opencode_user: alice
        #
        # bob-desktop:
        #   ansible_host: 192.168.1.11
        #   opencode_user: bob
        #
        # An admin account deploying for someone who has no sudo:
        # carol-laptop:
        #   ansible_host: 192.168.1.12
        #   opencode_user: carol
