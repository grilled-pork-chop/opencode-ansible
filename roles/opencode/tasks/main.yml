---
# 1. Binary, once, system-wide (on PATH for every user).
- name: Install opencode binary
  ansible.builtin.copy:
    src: opencode
    dest: "{{ opencode_bin_path }}"
    owner: root
    group: root
    mode: "0755"
  tags: [binary]

- name: Check installed opencode version
  ansible.builtin.command: "{{ opencode_bin_path }} --version"
  register: opencode_version_check
  changed_when: false
  tags: [binary]

- name: Assert the binary matches the pinned version
  ansible.builtin.assert:
    that: opencode_version_check.stdout is search(opencode_version)
    fail_msg: >-
      opencode reports '{{ opencode_version_check.stdout }}',
      expected '{{ opencode_version }}'. Replace roles/opencode/files/opencode
      and/or fix opencode_version.
    success_msg: "opencode {{ opencode_version_check.stdout }} installed at {{ opencode_bin_path }}."
  tags: [binary]

# 2. Per-user payload (config + commands + skills + plugins) in ~/.config/opencode.
- name: Read passwd database to resolve user homes
  ansible.builtin.getent:
    database: passwd
  when: opencode_users | length > 0
  tags: [config, plugins]

- name: Deploy opencode payload per user
  ansible.builtin.include_tasks: deploy_user.yml
  loop: "{{ opencode_users }}"
  loop_control:
    loop_var: opencode_account
  tags: [config, plugins]
