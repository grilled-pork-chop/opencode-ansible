---
# opencode role — entry point
#
# Orchestrates the full deploy pipeline in order:
#   1. preflight  — validate committed artifacts, read the passwd database
#   2. detect     — determine current version and action (install / upgrade / none)
#   3. install    — copy the pinned system binary (backing up any old one on upgrade)
#   4. config     — deploy the per-user payload into ~/.config/opencode
#   5. verify     — smoke-test the installed binary

- import_tasks: preflight.yml
- import_tasks: detect.yml
- import_tasks: install.yml
- import_tasks: config.yml
- import_tasks: verify.yml
