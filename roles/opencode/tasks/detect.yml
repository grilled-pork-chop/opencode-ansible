---
# detect — determine what action the role should take
#
# Reads the currently installed version (if any) and sets two facts:
#
#   opencode__current_version
#       The version string reported by the installed binary, or "none"
#       if opencode is not installed.
#
#   opencode__action
#       One of three values:
#         "install"  — no binary present, or opencode_force_reinstall is true
#         "upgrade"  — binary exists but reports a different version
#         "none"     — correct version already installed, nothing to do
#
# All downstream tasks are idempotent, so the "none" action is purely
# informational (shown in the debug output). It does NOT gate any task —
# copy/file/template modules are no-ops when content is unchanged. The only
# non-idempotent task is the binary backup in install.yml, which is guarded
# by opencode__action == 'upgrade' directly.

- name: "Read installed binary"
  ansible.builtin.stat:
    path: "{{ opencode_bin_path }}"
  register: opencode__existing
  tags: [opencode, detect]

- name: "Read installed version string"
  ansible.builtin.command:
    cmd: "{{ opencode_bin_path }} --version"
  register: opencode__installed_ver
  changed_when: false
  failed_when: false
  when: opencode__existing.stat.exists
  tags: [opencode, detect]

- name: "Determine current version"
  ansible.builtin.set_fact:
    opencode__current_version: >-
      {{ (opencode__installed_ver.stdout | default('') | trim).split() | last | default('none', true) }}
  tags: [opencode, detect]

- name: "Determine action"
  ansible.builtin.set_fact:
    opencode__action: >-
      {{ 'none' if (not opencode_force_reinstall | bool and opencode__current_version == opencode_version)
         else 'upgrade' if (opencode__existing.stat.exists and opencode__current_version not in ['none', opencode_version])
         else 'install' }}
  tags: [opencode, detect]

- name: "Show action"
  ansible.builtin.debug:
    msg: >-
      {{ 'opencode ' ~ opencode_version ~ ' already installed.'
         if opencode__action == 'none'
         else opencode__action | capitalize ~ ': '
              ~ opencode__current_version ~ ' → ' ~ opencode_version }}
  tags: [opencode, detect]
