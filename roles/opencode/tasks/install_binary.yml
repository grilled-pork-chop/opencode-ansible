---
# install_binary: deploy the pinned binary system-wide
#
# Copies the committed opencode binary to opencode_bin_path so it lands on PATH
# for every user. The copy is idempotent. It does nothing when the binary is
# unchanged, so it needs no when: opencode__action guard.
#
# The one exception is the pre-upgrade backup. That is not idempotent (it would
# re-copy the file on every run), so it is guarded with:
#   when: opencode__action == 'upgrade' and opencode_keep_backup | bool
# That way it only runs when we are actually replacing a different version.
#
# The owner/group come from vars rather than being hardcoded to root, so an
# unprivileged trial install (`make local`) can drop the binary in a scratch dir
# without sudo. A real deploy leaves them at their root default.

- name: "Back up the existing binary before upgrade"
  ansible.builtin.copy:
    src: "{{ opencode_bin_path }}"
    dest: "{{ opencode_bin_path }}.bak.{{ opencode__current_version }}"
    mode: "0755"
    remote_src: true
  when:
    - opencode__action == 'upgrade'
    - opencode_keep_backup | bool

- name: "Install opencode binary"
  ansible.builtin.copy:
    src: "{{ opencode_binary_src }}"
    dest: "{{ opencode_bin_path }}"
    remote_src: "{{ opencode_artifact_remote | bool }}"
    owner: "{{ opencode_bin_owner }}"
    group: "{{ opencode_bin_group }}"
    mode: "0755"
