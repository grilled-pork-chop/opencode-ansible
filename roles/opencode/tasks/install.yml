---
# install — deploy the pinned binary system-wide
#
# Installs the committed opencode binary to opencode_bin_path (on PATH for every
# user). The copy is idempotent — it is a no-op when the binary is unchanged, so
# no when: opencode__action guard is needed here.
#
# The sole exception is the binary backup, which is NOT idempotent (it would
# re-copy the file every run). It is guarded by:
#   when: opencode__action == 'upgrade' and opencode_keep_backup | bool
# so it only runs when replacing a genuinely different version.

- name: "Back up the existing binary before upgrade"
  ansible.builtin.copy:
    src: "{{ opencode_bin_path }}"
    dest: "{{ opencode_bin_path }}.bak.{{ opencode__current_version }}"
    mode: "0755"
    remote_src: true
  when:
    - opencode__action == 'upgrade'
    - opencode_keep_backup | bool
  tags: [opencode, binary, upgrade]

- name: "Install opencode binary"
  ansible.builtin.copy:
    src: opencode
    dest: "{{ opencode_bin_path }}"
    owner: root
    group: root
    mode: "0755"
  tags: [opencode, binary]
