---
- name: "Create user config directory"
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ opencode_user }}"
  become: true
  become_user: "{{ opencode_user }}"
  tags: [opencode, config]

- name: "Write opencode.json"
  # backup: true creates a timestamped backup only when content changes — idempotent.
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "{{ opencode_config_file }}"
    owner: "{{ opencode_user }}"
    mode: "0644"
    backup: true
  become: true
  become_user: "{{ opencode_user }}"
  tags: [opencode, config]

- name: "Install wrapper at {{ opencode_bin_wrapper }}"
  ansible.builtin.template:
    src: opencode_wrapper.sh.j2
    dest: "{{ opencode_bin_wrapper }}"
    mode: "0755"
  tags: [opencode, wrapper]
