---
# Per-user payload for the primary user (opencode_user). preflight already
# resolved opencode_user_home and opencode_config_dir.
#
# Steps:
#   1. Binary  — a real ~/.opencode/bin/opencode is the user's own install, which
#                shadows the fleet binary on PATH, so back it up and symlink it to
#                opencode_bin_path. Fresh users (no such file) are left untouched.
#                The symlink sets no owner/group on purpose: the file module would
#                follow the link and chown the shared root-owned target.
#   2. Config  — render opencode.jsonc. First read any existing one: if it lacks
#                the "MANAGED BY ANSIBLE" marker it is hand-authored, so back it up
#                first. A stray opencode.json (opencode reads it too) is moved
#                aside — removes: runs that only when it is present.
#   3. Payload — copy commands/, plugins/, instructions/ into the config dir.
#   4. Runtime — pre-stage @opencode-ai/plugin (see stage_plugin_runtime.yml) in
#                BOTH ~/.opencode and the config dir so imports resolve wherever
#                opencode looks.
#
# Non-destructive contract: anything the user already had is renamed to a
# timestamped *.bak, never deleted. Once the role owns a file (marker/symlink
# present) the backup steps skip, so version/URL bumps don't pile up backups.

- name: "Check for a user-installed binary that would shadow the fleet one"
  ansible.builtin.stat:
    path: "{{ opencode_user_home }}/.opencode/bin/opencode"
  register: opencode__user_bin
  tags: [opencode, binary]

- name: "Back up a real user-installed binary before replacing it"  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      mv "{{ opencode_user_home }}/.opencode/bin/opencode"
         "{{ opencode_user_home }}/.opencode/bin/opencode.{{ ansible_date_time.iso8601_basic_short }}.bak"
  changed_when: true
  when: opencode__user_bin.stat.exists and not opencode__user_bin.stat.islnk
  tags: [opencode, binary]

- name: "Symlink the user's binary to the pinned fleet binary"
  ansible.builtin.file:
    src: "{{ opencode_bin_path }}"
    dest: "{{ opencode_user_home }}/.opencode/bin/opencode"
    state: link
    force: true
  when: opencode__user_bin.stat.exists
  tags: [opencode, binary]

- name: "Ensure the user config dir exists"
  ansible.builtin.file:
    path: "{{ opencode_config_dir }}"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_user }}"
    mode: "0755"
  tags: [opencode, config]

- name: "Read any existing opencode.jsonc"
  ansible.builtin.slurp:
    src: "{{ opencode_config_dir }}/opencode.jsonc"
  register: opencode__existing_jsonc
  failed_when: false
  tags: [opencode, config]

- name: "Back up a hand-authored opencode.jsonc (no managed marker)"  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      mv "{{ opencode_config_dir }}/opencode.jsonc"
         "{{ opencode_config_dir }}/opencode.jsonc.{{ ansible_date_time.iso8601_basic_short }}.bak"
  changed_when: true
  when:
    - opencode__existing_jsonc.content is defined
    - "'MANAGED BY ANSIBLE' not in (opencode__existing_jsonc.content | b64decode)"
  tags: [opencode, config]

- name: "Render opencode.jsonc"
  ansible.builtin.template:
    src: opencode.jsonc.j2
    dest: "{{ opencode_config_dir }}/opencode.jsonc"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_user }}"
    mode: "0644"
  tags: [opencode, config]

- name: "Back up a competing opencode.json (role owns .jsonc)"  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      mv "{{ opencode_config_dir }}/opencode.json"
         "{{ opencode_config_dir }}/opencode.json.{{ ansible_date_time.iso8601_basic_short }}.bak"
    removes: "{{ opencode_config_dir }}/opencode.json"
  tags: [opencode, config]

- name: "Deploy commands, plugins, and instructions"
  ansible.builtin.copy:
    src: "{{ item }}/"
    dest: "{{ opencode_config_dir }}/{{ item }}/"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_user }}"
    mode: preserve
  loop:
    - commands
    - plugins
    - instructions
  tags: [opencode, plugins]

- name: "Pre-stage the plugin runtime in both locations"
  ansible.builtin.include_tasks: stage_plugin_runtime.yml
  loop:
    - "{{ opencode_user_home }}/.opencode"
    - "{{ opencode_config_dir }}"
  loop_control:
    loop_var: opencode__runtime_dir
  tags: [opencode, plugins]
