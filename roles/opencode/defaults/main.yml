---
# Pinned opencode version. Bump this and run `make fetch` to upgrade.
# (Asserted at runtime against `opencode --version`.)
opencode_version: "1.17.11"

# Where the system-wide binary lands (on PATH for every user).
opencode_bin_path: "/usr/local/bin/opencode"

# Local OpenAI-compatible endpoint the deployed config points at.
# Models are auto-discovered by the bundled local-model plugin — no model var.
opencode_provider_url: "http://localhost:8000/v1"

# Skill-marketplace API endpoint. Passed to the opencode-marketplace plugin as
# its api_endpoint option. The plugin appends /api/v1 itself, so give the bare
# host[:port] (no path). Override per fleet in group_vars/.
opencode_marketplace_url: "http://localhost:8000"

# Accounts that get the per-user payload (config + commands + instructions + plugins)
# in their ~/.config/opencode/. Declare the real list in group_vars/.
# Example:
#   opencode_users:
#     - alice
#     - bob
opencode_users: []
